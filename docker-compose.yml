services:
  postgres:
    image: postgres:16-alpine
    container_name: house_prices_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-house_prices}
      POSTGRES_USER: ${POSTGRES_USER:-prices}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Host 5432 is taken by another project on this host; expose on 5433.
      # Internal services still reach the DB at postgres:5432 over the compose network.
      - "5433:5432"
    networks:
      - house_prices_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prices} -d ${POSTGRES_DB:-house_prices}"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: house_prices_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: ""
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3001/grafana}"
      POSTGRES_DB: ${POSTGRES_DB:-house_prices}
      POSTGRES_USER: ${POSTGRES_USER:-prices}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - house_prices_net
      - picxibox_net
    depends_on:
      postgres:
        condition: service_healthy
    user: "472"

  ingest:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    dns:
      - 1.1.1.1
      - 8.8.8.8
    container_name: house_prices_ingest
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-house_prices}
      POSTGRES_USER: ${POSTGRES_USER:-prices}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TARGET_COUNTIES: ${TARGET_COUNTIES}
    volumes:
      - ./logs:/app/logs
    networks:
      - house_prices_net
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - ingest

  postcode-ingest:
      build:
        context: ./ingest
        dockerfile: Dockerfile
      container_name: house_prices_postcode_ingest
      environment:
        POSTGRES_HOST: postgres
        POSTGRES_DB: ${POSTGRES_DB:-house_prices}
        POSTGRES_USER: ${POSTGRES_USER:-prices}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      volumes:
        - ./postcode_csv:/app/postcode_csv:ro
      networks:
        - house_prices_net
      depends_on:
        postgres:
          condition: service_healthy
      profiles:
        - postcode

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: house_prices_api
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-house_prices}
      POSTGRES_USER: ${POSTGRES_USER:-prices}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TARGET_COUNTIES: ${TARGET_COUNTIES}
      LLM_HOST: ${LLM_HOST:-http://localhost:8080}
      LLM_MODEL: ${LLM_MODEL:-Qwen3-8B-Q4_K_M.gguf}
      AGENT_DB_USER: ${AGENT_DB_USER:-agent_ro}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-3}
      AGENT_MAX_ROWS: ${AGENT_MAX_ROWS:-25}
      AGENT_SQL_ROW_LIMIT: ${AGENT_SQL_ROW_LIMIT:-500}
      AGENT_TOOL_MODE: ${AGENT_TOOL_MODE:-structured}
    volumes:
      - ./logs:/app/logs
    ports:
      # Host 8001/8002 taken by other projects on this host; expose on 8003.
      - "8003:8000"
    networks:
      - house_prices_net
      - picxibox_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp:
    build:
      context: .
      dockerfile: api/Dockerfile.mcp
    container_name: house_prices_mcp
    restart: unless-stopped
    # Streamable-HTTP MCP server exposing the analysis tools at /mcp.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-house_prices}
      # Read-only agent_ro role only — the MCP server never needs write access.
      AGENT_DB_USER: ${AGENT_DB_USER:-agent_ro}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
      AGENT_SQL_ROW_LIMIT: ${AGENT_SQL_ROW_LIMIT:-500}
      # CORS origins allowed for browser MCP clients (comma-separated; default any)
      MCP_ALLOW_ORIGINS: ${MCP_ALLOW_ORIGINS:-*}
    ports:
      - "8004:8000"
    networks:
      - house_prices_net
      - picxibox_net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  house_prices_net:
    driver: bridge
  picxibox_net:
    external: true
